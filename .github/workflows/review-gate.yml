name: Review gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  evaluate-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Publish review-gate status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          state=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[]' |
            jq -rs --arg sha "$SHA" -f .github/review-verdict.jq)
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=review-gate \
            -f description="Review verdict on latest commit: $state"
