name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: read

jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check branch, title and linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|refactor|test|chore|ci'
          die() { echo "::error::$1"; exit 1; }
          [[ $BRANCH =~ ^($types)/([0-9]+)-[a-z0-9-]+$ ]] || die "Branch must be <type>/<issue>-<slug>"
          issue=${BASH_REMATCH[2]}
          [[ $TITLE =~ ^($types)(\([a-z0-9-]+\))?!?:\ .+ ]] || die "Title must follow Conventional Commits"
          grep -qiE "(^|[^a-z])(closes|fixes|resolves) #${issue}([^0-9]|$)" <<<"$BODY" || die "Body must contain 'Closes #${issue}'"
          state=$(gh api "repos/$REPO/issues/$issue" --jq 'if .pull_request then "pr" else .state end')
          [[ $state == open ]] || die "#${issue} must be an open issue (got: $state)"
